<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

       
        .navbar {
            width: 100%;
            background-color: #0866ff;
            padding: 15px 25px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            padding: 12px 18px;
            border-radius: 7px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background-color: #0047cc;
        }

        .navbar a.active {
            background-color: white;
            color: #0866ff;
        }

      
        .main-container {
            min-height: calc(100vh - 65px);
            padding: 40px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

  
        .contact-card {
            width: 100%;
            max-width: 800px;
            padding: 40px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin: 0 0 30px;
            color: #222;
            font-size: 36px;
        }

        .contact-info {
            background-color: #f7f7f7;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .contact-info:last-child {
            margin-bottom: 0;
        }

        .contact-info h4 {
            color: #0866ff;
            font-size: 20px;
            margin: 0 0 10px;
        }

        .contact-info p {
            color: #333;
            font-size: 19px;
            margin: 0;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

 
        @media (max-width: 768px) {
            .navbar {
                padding: 12px;
                gap: 5px;
            }

            .navbar a {
                padding: 12px 14px;
                font-size: 15px;
            }

            .main-container {
                padding: 35px 18px;
            }

            .contact-card {
                max-width: 650px;
                padding: 35px;
            }

            h2 {
                font-size: 32px;
            }

            .contact-info {
                padding: 22px;
            }

            .contact-info h4 {
                font-size: 19px;
            }

            .contact-info p {
                font-size: 18px;
            }
        }

    
        @media (max-width: 480px) {
            .navbar {
                padding: 12px 8px;
                justify-content: center;
                gap: 3px;
            }

            .navbar a {
                padding: 12px 10px;
                font-size: 13px;
                border-radius: 6px;
            }

            .main-container {
                min-height: calc(100vh - 55px);
                padding: 30px 12px;
            }

            .contact-card {
                width: 100%;
                padding: 28px 20px;
                border-radius: 14px;
            }

            h2 {
                font-size: 30px;
                margin-bottom: 28px;
            }

            .contact-info {
                padding: 22px 18px;
                margin-bottom: 18px;
                border-radius: 10px;
            }

            .contact-info h4 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .contact-info p {
                font-size: 17px;
                line-height: 1.7;
            }
        }

    
        @media (max-width: 340px) {
            .navbar {
                gap: 0;
                padding: 10px 4px;
            }

            .navbar a {
                padding: 11px 7px;
                font-size: 12px;
            }

            .contact-card {
                padding: 24px 15px;
            }

            .contact-info {
                padding: 18px 13px;
            }
        }
    </style>
</head>

<body>

    
    <nav class="navbar">
        <a href="index.html">HOME</a>
        <a href="Product.html">PRODUCTS</a>
        <a href="About.html">ABOUT</a>
    </nav>

    
    <main class="main-container">

        <div class="contact-card">

            <h2>Contact Us</h2>

            <div class="contact-info">
                <h4>Location</h4>
                <p>Linamon, Lanao del Norte, Philippines</p>
            </div>

            <div class="contact-info">
                <h4>Cellphone Number</h4>
                <p>0936-161-1581</p>
            </div>

            <div class="contact-info">
                <h4>Email Address</h4>
                <p>ManilynBagolos@gmail.com</p>
            </div>

        </div>

    </main>

</body>
</html>
