<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 100px 15px 30px;
        }

        .back-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            z-index: 1000;
        }

        .back-button:hover {
            background-color: #555;
        }

       
        .contact-card {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .contact-info {
            background-color: #f7f7f7;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .contact-info h4 {
            color: #3498db;
            font-size: 13px;
            margin: 0 0 5px;
        }

        .contact-info p {
            color: #333;
            font-size: 13px;
            margin: 0;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

   
        @media (max-width: 480px) {
            body {
                padding: 85px 15px 25px;
            }

            .back-button {
                top: 15px;
                right: 15px;
                padding: 9px 15px;
            }

            .contact-card {
                padding: 22px 18px;
            }

            h2 {
                font-size: 22px;
            }
        }

        /* Tablet */
        @media (min-width: 481px) and (max-width: 768px) {
            .contact-card {
                max-width: 450px;
            }
        }

        
        @media (min-width: 769px) {
            .contact-card {
                max-width: 500px;
            }
        }
    </style>
</head>

<body>

    <!-- Only Back Button -->
    <a href="index.html" class="back-button">Back</a>

    <div class="contact-card">
        <h2>Contact Us</h2>

        <div class="contact-info">
            <h4>Location</h4>
            <p>Linamon, Lanao del Norte, Philippines</p>
        </div>

        <div class="contact-info">
            <h4>Cellphone Number</h4>
            <p>0936-161-1581</p>
        </div>

        <div class="contact-info">
            <h4>Email Address</h4>
            <p>ManilynBagolos@gmail.com</p>
        </div>
    </div>

</body>
</html>
