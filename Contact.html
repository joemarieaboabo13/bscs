<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;

            padding: 100px 15px 30px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* BIG BLUE BACK BUTTON */
        .back-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #0866ff;
            color: white;
            padding: 18px 35px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            transition: 0.3s;
        }

        .back-button:hover {
            background-color: #0047cc;
            transform: scale(1.05);
        }

        /* CONTACT CARD */
        .contact-card {
            width: 100%;
            max-width: 800px;
            padding: 40px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin: 0 0 30px;
            color: #222;
            font-size: 36px;
        }

        .contact-info {
            background-color: #f7f7f7;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .contact-info:last-child {
            margin-bottom: 0;
        }

        .contact-info h4 {
            color: #0866ff;
            font-size: 20px;
            margin: 0 0 10px;
        }

        .contact-info p {
            color: #333;
            font-size: 19px;
            margin: 0;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        /* TABLET */
        @media (max-width: 768px) {
            body {
                padding: 110px 20px 35px;
            }

            .contact-card {
                max-width: 650px;
                padding: 35px;
            }

            h2 {
                font-size: 32px;
            }

            .contact-info {
                padding: 22px;
            }

            .contact-info h4 {
                font-size: 19px;
            }

            .contact-info p {
                font-size: 18px;
            }
        }

        /* CELLPHONE */
        @media (max-width: 480px) {
            body {
                padding: 100px 12px 25px;
            }

            .back-button {
                top: 15px;
                right: 15px;
                padding: 14px 24px;
                font-size: 18px;
                border-radius: 8px;
            }

            .contact-card {
                width: 100%;
                max-width: none;
                padding: 28px 20px;
                border-radius: 14px;
            }

            h2 {
                font-size: 30px;
                margin-bottom: 28px;
            }

            .contact-info {
                padding: 22px 18px;
                margin-bottom: 18px;
                border-radius: 10px;
            }

            .contact-info h4 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .contact-info p {
                font-size: 17px;
                line-height: 1.7;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-button">Back</a>

    <div class="contact-card">

        <h2>Contact Us</h2>

        <div class="contact-info">
            <h4>Location</h4>
            <p>Linamon, Lanao del Norte, Philippines</p>
        </div>

        <div class="contact-info">
            <h4>Cellphone Number</h4>
            <p>0936-161-1581</p>
        </div>

        <div class="contact-info">
            <h4>Email Address</h4>
            <p>ManilynBagolos@gmail.com</p>
        </div>

    </div>

</body>
</html>
