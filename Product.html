<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorcycle Parts Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        /* Back button in the upper-right corner */
        .back-button {
            display: block;
            width: fit-content;
            margin-left: auto;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 15px;
        }

        .back-button:hover {
            background-color: #0056b3;
        }

        h1 {
            text-align: center;
            color: #333;
            margin: 20px 0 30px;
            font-size: clamp(24px, 4vw, 36px);
        }

        .products {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(min(100%, 200px), 1fr)
            );
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .product {
            min-width: 0;
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .product h2 {
            color: #333;
            font-size: 20px;
        }

        .product p {
            color: #555;
        }

        .price {
            color: #007bff !important;
            font-weight: bold;
            font-size: 18px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            max-width: 100%;
        }

        button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .products {
                gap: 12px;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .product {
                padding: 12px 8px;
            }

            .product h2 {
                font-size: 16px;
            }

            button {
                padding: 9px 12px;
                font-size: 13px;
            }

            .back-button {
                padding: 9px 15px;
                font-size: 14px;
            }
        }

        @media (max-width: 320px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-button">Back</a>

    <h1>Motorcycle Parts</h1>

    <div class="products">

        <div class="product">
            <h2>Motorcycle Tire</h2>
            <p class="price">₱1,500</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h2>Brake Pad</h2>
            <p class="price">₱450</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h2>Motorcycle Chain</h2>
            <p class="price">₱800</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h2>Battery</h2>
            <p class="price">₱1,200</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h2>Side Mirror</h2>
            <p class="price">₱350</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h2>LED Headlight</h2>
            <p class="price">₱650</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h2>Air Filter</h2>
            <p class="price">₱300</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h2>Engine Oil</h2>
            <p class="price">₱550</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h2>Clutch Cable</h2>
            <p class="price">₱250</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <h2>Horn</h2>
            <p class="price">₱200</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
