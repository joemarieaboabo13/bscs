<!DOCTYPE html>
<html>
<head>
<style>
* {box-sizing: border-box;}

body { 
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
}

.header {
  overflow: hidden;
  background-color: #f1f1f1;
  padding: 20px 10px;
}

.header a {
  float: left;
  color: black;
  text-align: center;
  padding: 12px;
  text-decoration: none;
  font-size: 18px; 
  line-height: 25px;
  border-radius: 4px;
}

.header a.logo {
  font-size: 25px;
  font-weight: bold;
}

.header a:hover {
  background-color: #ddd;
  color: black;
}

.header a.active {
  background-color: dodgerblue;
  color: white;
}

.header-right {
  float: right;
}

@media screen and (max-width: 500px) {
  .header a {
    float: none;
    display: block;
    text-align: left;
  }
  
  .header-right {
    float: none;
  }
}
 .card {
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  max-width: 300px;
  margin: 20px;
  text-align: center;
  font-family: arial;
 } 

.cards button:hover {
  opacity: 0.7;
}
.container {
   display: grid;
   justify-content: center;
   }


         

		 
.price {
  color: grey;
  font-size: 22px;
}

.card button {
  border: none;
  outline: 0;
  padding: 12px;
  color: white;
  background-color: #000;
  text-align: center;
  cursor: pointer;
  width: 100%;
  font-size: 18px;
}

.card button:hover {
  opacity: 0.7;
}
</style>
</head>
<body>

<div class="header">
  <a href="#default" class="logo">CompanyLogo</a>
  <div class="header-right">
    <button onclick="myFunction()"><a href="index.html" target="_blank">Home</button>
     <button onclick="myFunction()"><a href="Contact.html" target="_blank">Contact</button>
	  <button onclick="myFunction()"><a href="About.html" target="_blank">About</button>
  </div>
</div>
<div class="container">
<div class="card">
  <img src="Ok.jpg" alt="KEIHIN Carburetor" style="width:100%">
  <h1>KEIHIN Carburetor</h1>
  <p class="price">$19.99</p>
  <p><button>Add to Cart</button></p>
  </div>
  <br>
  <br>
<div class="container">
<div class="card">
  <img src="k.jpg" alt="YAMAHA CYLINDER HEAD ASSY" style="width:100%">
  <h1>YAMAHA CYLINDER HEAD ASSY</h1>
  <p class="price">$40.99</p>
  <p><button>Add to Cart</button></p>
</div>
</div>

</body>
</html>
