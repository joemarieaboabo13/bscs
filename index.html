<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ling Ling Motor Shop</title>

    <style>
       
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            font-family: Arial, sans-serif;
            text-align: center;

            background: linear-gradient(
                135deg,
                #001f3f,
                #00a6a6,
                #7fffd4
            );
        }

        h1 {
            color: white;
            padding-top: 15vh;
            margin-bottom: 30px;
            font-size: clamp(26px, 4vw, 45px);
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .buttons a {
            display: inline-block;
            padding: 12px 25px;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            border-radius: 10px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .buttons a:hover {
            background: white;
            color: #008080;
        }

        @media (max-width: 480px) {
            h1 {
                padding-top: 12vh;
                font-size: 28px;
            }

            .buttons {
                gap: 8px;
            }

            .buttons a {
                padding: 10px 16px;
                font-size: 14px;
            }
        }

        @media (min-width: 481px) and (max-width: 1024px) {
            h1 {
                padding-top: 15vh;
                font-size: 38px;
            }

            .buttons a {
                padding: 12px 22px;
            }
        }

      
        @media (min-width: 1025px) {
            h1 {
                padding-top: 18vh;
            }

            .buttons a {
                padding: 14px 28px;
            }
        }
    </style>
</head>

<body>

   
    <h1>Welcome to Ling Ling Motor Shop</h1>


    <div class="buttons">
        <a href="Products.html">Products</a>
        <a href="Contact.html">Contact</a>
        <a href="About.html">About</a>
    </div>

</body>
</html>
