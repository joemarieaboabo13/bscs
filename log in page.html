<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Login</title>

    <style>
        <style>
        body {
            background-image: url("aurora.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 15px;

            background: linear-gradient(
                135deg,
                #001f3f,
                #008080,
                #7fffd4
            );
        }

        .login-box {
            width: 100%;
            max-width: 350px;
            padding: 35px 30px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #b5d2ed;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #008c9e;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #006b78;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <form action="#" method="post">

            <input
                type="text"
                name="marie"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="12345"
                placeholder="Password"
                required
            >

            <button type="submit"><a href="index.html">Log In</a></button>

        </form>
    </div>

</body>
</html>
